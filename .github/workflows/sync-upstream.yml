name: Sync fork with upstream

on:
  workflow_dispatch:
  schedule:
    # Once a day, away from the top of the hour to reduce schedule delays.
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update master from the fork parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=master
